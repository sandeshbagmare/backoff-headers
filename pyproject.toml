[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backoff-headers"
version = "0.1.0"
description = "Read Retry-After and RateLimit headers and turn them into a wait time"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["http", "retry-after", "rate-limit", "backoff", "client", "headers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/backoff-headers"
Issues = "https://github.com/sandeshbagmare/backoff-headers/issues"
Changelog = "https://github.com/sandeshbagmare/backoff-headers/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/backoff_headers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
